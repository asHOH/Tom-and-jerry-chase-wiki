<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 - 猫鼠百科</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f3f4f6;
        --surface: #ffffff;
        --foreground: #111827;
        --muted: #4b5563;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #0f172a;
          --surface: #1e293b;
          --foreground: #e2e8f0;
          --muted: #9ca3af;
          --border: #334155;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 1rem;
        background-color: var(--background);
        color: var(--foreground);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 28rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: #2563eb;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: white;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .retry-btn {
        background: #2563eb;
        color: white;
        min-height: 44px;
        font-family: inherit;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .retry-btn:hover {
        background: #1d4ed8;
      }
      .features {
        margin-top: 2rem;
        text-align: left;
      }
      .feature {
        display: flex;
        align-items: center;
        margin: 0.5rem 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .feature::before {
        content: '✓';
        color: #10b981;
        font-weight: bold;
        margin-right: 0.5rem;
      }
      .retry-btn:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .retry-btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="icon">📱</div>
      <h1>您正在离线浏览</h1>
      <p>无法连接到互联网，但您仍可以访问已缓存的页面和数据。</p>

      <button class="retry-btn" onclick="location.reload()">重试连接</button>

      <div class="features">
        <div class="feature">已缓存的角色数据可离线查看</div>
        <div class="feature">知识卡信息本地存储</div>
        <div class="feature">基本功能正常使用</div>
      </div>
    </main>

    <script>
      // Auto-retry connection after 30 seconds
      setTimeout(() => {
        if (navigator.onLine) {
          location.reload();
        }
      }, 30000);

      // Listen for online event
      window.addEventListener('online', () => {
        location.reload();
      });
    </script>
  </body>
</html>
